<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Modern Secure Flipbook</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ใช้ PDF.js v2.16.105 เสถียรที่สุดสำหรับ Client-side Native Canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <!-- CryptoJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .page {
      background-color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    #zoom-container {
      transition: transform 0.15s ease-out;
      transform-origin: center center;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none overflow-x-hidden">

  <!-- โซน 1: อัปโหลด & ตั้งรหัสผ่าน -->
  <div id="upload-panel" class="w-full max-w-md bg-slate-800/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-teal-500/20 text-teal-400 flex items-center justify-center mx-auto mb-3 text-2xl">
        📖
      </div>
      <h1 class="text-xl font-bold text-white">สร้าง Flipbook ติดรหัสผ่าน</h1>
      <p class="text-xs text-slate-400 mt-1">แปลง PDF และเข้ารหัสไฟล์ก่อนเปิดอ่าน</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">เลือกไฟล์ PDF</label>
        <input type="file" id="pdf-file" accept="application/pdf" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-teal-600 file:text-white file:font-semibold hover:file:bg-teal-500 cursor-pointer bg-slate-900 rounded-xl border border-slate-700">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-2">กำหนดรหัสผ่านล็อกไฟล์</label>
        <input type="password" id="set-password" placeholder="ใส่รหัสผ่านที่ต้องการ" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none text-white text-sm">
      </div>

      <button id="btn-process" class="w-full py-3 bg-teal-600 hover:bg-teal-500 font-semibold rounded-xl text-white transition shadow-lg shadow-teal-600/20">
        เข้ารหัสและเริ่มสร้าง Flipbook
      </button>
    </div>
  </div>

  <!-- โซน 2: ปลดล็อกรหัสผ่าน -->
  <div id="password-modal" class="hidden w-full max-w-sm bg-slate-800/95 p-6 sm:p-8 rounded-3xl border border-slate-700 shadow-2xl text-center">
    <div class="w-12 h-12 rounded-2xl bg-teal-500/20 text-teal-400 flex items-center justify-center mx-auto mb-3 text-xl">
      🔒
    </div>
    <h2 class="text-lg font-bold mb-1">เอกสารนี้ถูกล็อกไว้</h2>
    <p class="text-xs text-slate-400 mb-4">กรุณาใส่รหัสผ่านเพื่อถอดรหัสเอกสาร</p>
    
    <input type="password" id="input-password" placeholder="ใส่รหัสผ่าน" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none text-white text-sm mb-3 text-center tracking-wider">
    <p id="error-msg" class="text-xs text-rose-400 mb-3 hidden">รหัสผ่านไม่ถูกต้อง</p>
    
    <button id="btn-unlock" class="w-full py-2.5 bg-teal-600 hover:bg-teal-500 text-white font-semibold rounded-xl transition">
      ปลดล็อกเอกสาร
    </button>
  </div>

  <!-- ข้อความสถานะตอนกำลัง Render หน้า -->
  <div id="loading-spinner" class="hidden flex flex-col items-center gap-3">
    <div class="w-8 h-8 border-4 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-text" class="text-xs text-teal-400 font-medium">กำลังเตรียมหน้าเอกสาร...</p>
  </div>

  <!-- โซน 3: ตัวแสดงผล Flipbook -->
  <div id="viewer-panel" class="hidden w-full flex flex-col items-center justify-center">
    
    <!-- Viewport Container -->
    <div class="w-full flex items-center justify-center overflow-hidden py-4" style="min-height: 70vh;">
      <div id="zoom-container">
        <!-- Container StPageFlip จะถูก inject ลงตรงนี้ -->
        <div id="book"></div>
      </div>
    </div>

    <!-- แผงควบคุม Floating Bar ด้านล่าง -->
    <div class="fixed bottom-5 z-50 flex items-center gap-2 px-3 py-2 bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700 shadow-2xl">
      <button id="btn-prev" class="p-2 hover:bg-slate-700 rounded-xl transition text-xs flex items-center gap-1">
        ◀ <span class="hidden sm:inline">ก่อนหน้า</span>
      </button>

      <span id="page-num" class="px-2 text-xs font-semibold text-teal-400">1 / 1</span>

      <button id="btn-next" class="p-2 hover:bg-slate-700 rounded-xl transition text-xs flex items-center gap-1">
        <span class="hidden sm:inline">ถัดไป</span> ▶
      </button>

      <div class="w-px h-4 bg-slate-700 mx-1"></div>

      <button id="btn-zoom-in" class="p-2 hover:bg-slate-700 rounded-xl text-xs font-bold" title="ขยาย">+</button>
      <button id="btn-zoom-reset" class="px-2 py-1 hover:bg-slate-700 rounded-lg text-[10px] text-slate-300" title="รีเซ็ต">100%</button>
      <button id="btn-zoom-out" class="p-2 hover:bg-slate-700 rounded-xl text-xs font-bold" title="ย่อ">-</button>

      <div class="w-px h-4 bg-slate-700 mx-1"></div>

      <button id="btn-fullscreen" class="p-2 hover:bg-slate-700 rounded-xl text-xs" title="เต็มจอ">⛶</button>
    </div>
  </div>

  <script>
    // กำหนด Worker URL ให้ตรงกับเวอร์ชัน 2.16.105
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let encryptedPayload = null;
    let flipBook = null;
    let zoomLevel = 1;
    let totalPagesCount = 1;

    // 1. เข้ารหัสไฟล์
    document.getElementById('btn-process').addEventListener('click', () => {
      const file = document.getElementById('pdf-file').files[0];
      const pass = document.getElementById('set-password').value;

      if (!file) return alert('กรุณาเลือกไฟล์ PDF');
      if (!pass) return alert('กรุณาตั้งรหัสผ่าน');

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        encryptedPayload = CryptoJS.AES.encrypt(base64Data, pass).toString();

        document.getElementById('upload-panel').classList.add('hidden');
        document.getElementById('password-modal').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });

    // 2. ถอดรหัสไฟล์
    document.getElementById('btn-unlock').addEventListener('click', () => {
      const pass = document.getElementById('input-password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const decrypted = CryptoJS.AES.decrypt(encryptedPayload, pass);
        const originalBase64 = decrypted.toString(CryptoJS.enc.Utf8);

        if (!originalBase64) {
          errorMsg.classList.remove('hidden');
          return;
        }

        // แปลง Base64 สู่ Uint8Array
        const raw = window.atob(originalBase64);
        const uint8Array = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) {
          uint8Array[i] = raw.charCodeAt(i);
        }

        document.getElementById('password-modal').classList.add('hidden');
        document.getElementById('loading-spinner').classList.remove('hidden');

        // เริ่มโหลดและสร้าง Flipbook
        renderPDFToFlipbook(uint8Array);

      } catch (err) {
        errorMsg.classList.remove('hidden');
      }
    });

    // 3. ฟังก์ชันเรนเดอร์ PDF ด้วย PDF.js เข้าสู่ StPageFlip
    async function renderPDFToFlipbook(pdfData) {
      try {
        const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
        totalPagesCount = pdf.numPages;

        const bookContainer = document.getElementById('book');
        bookContainer.innerHTML = '';

        // ดึงสัดส่วนขนาดหน้าแรกมาเป็นเกณฑ์
        const firstPage = await pdf.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1.0 });
        const pageWidth = Math.round(baseViewport.width);
        const pageHeight = Math.round(baseViewport.height);

        // เรนเดอร์ Canvas ทีละหน้าตามลำดับ (Sequential) เพื่อป้องกัน Memory crash
        for (let pageNum = 1; pageNum <= totalPagesCount; pageNum++) {
          document.getElementById('loading-text').innerText = `กำลังประมวลผลหน้า ${pageNum} จาก ${totalPagesCount}...`;
          
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 }); // สเกล 1.5x เพื่อความคมชัด

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = '100%';
          canvas.style.height = '100%';

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          pageDiv.appendChild(canvas);
          bookContainer.appendChild(pageDiv);
        }

        // ซ่อน Loading แล้วแสดง Viewer Panel
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('viewer-panel').classList.remove('hidden');

        // คำนวณขนาดกว้าง-ยาวให้เหมาะกับขนาดหน้าจอ
        const isMobile = window.innerWidth < 768;
        const targetWidth = isMobile ? Math.min(window.innerWidth * 0.9, 450) : Math.min(pageWidth, 500);
        const targetHeight = Math.round(targetWidth * (pageHeight / pageWidth));

        // สร้าง Object StPageFlip
        flipBook = new St.PageFlip(bookContainer, {
          width: targetWidth,
          height: targetHeight,
          size: 'stretch',
          minWidth: 260,
          maxWidth: 900,
          minHeight: 350,
          maxHeight: 1200,
          maxShadowOpacity: 0.4,
          showCover: true,
          mobileScrollSupport: false
        });

        // สั่งโหลดหน้าทั้งหมดเข้าสู่ Engine
        flipBook.loadFromHTML(document.querySelectorAll('#book .page'));

        document.getElementById('page-num').innerText = `1 / ${totalPagesCount}`;

        // จัดการ Event เมื่อมีการพลิกหน้า
        flipBook.on('flip', (e) => {
          document.getElementById('page-num').innerText = `${e.data + 1} / ${totalPagesCount}`;
        });

        // ผูกปุ่มเปลี่ยนหน้า
        document.getElementById('btn-prev').onclick = () => flipBook.flipPrev();
        document.getElementById('btn-next').onclick = () => flipBook.flipNext();

      } catch (error) {
        alert('เกิดข้อผิดพลาดในการโหลดไฟล์ PDF: ' + error.message);
      }
    }

    // ================= ระบบซูม (Zoom) =================
    const zoomContainer = document.getElementById('zoom-container');
    const zoomResetBtn = document.getElementById('btn-zoom-reset');

    function updateZoom(factor) {
      zoomLevel = Math.min(Math.max(factor, 0.7), 2.5);
      zoomContainer.style.transform = `scale(${zoomLevel})`;
      zoomResetBtn.innerText = `${Math.round(zoomLevel * 100)}%`;
    }

    document.getElementById('btn-zoom-in').onclick = () => updateZoom(zoomLevel + 0.2);
    document.getElementById('btn-zoom-out').onclick = () => updateZoom(zoomLevel - 0.2);
    zoomResetBtn.onclick = () => updateZoom(1);

    // ================= ระบบเต็มจอ (Fullscreen) =================
    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };
  </script>
</body>
</html>
